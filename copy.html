<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<body style="background:#0f172a;color:#fff;font:18px sans-serif;padding:24px">
<button id="b" style="font-size:22px;padding:18px 26px">Copy my code</button>
<p id="m"></p>
<script>
b.onclick=async function(){
  try{
    var r=await fetch("index.html?"+Date.now());
    var t=await r.text();
    try{ await navigator.clipboard.writeText(t); }
    catch(e){ var a=document.createElement("textarea"); a.value=t; document.body.appendChild(a); a.select(); document.execCommand("copy"); }
    m.textContent="Copied "+t.length+" characters. Now go to the chat and paste.";
  }catch(e){ m.textContent="Error: "+e; }
};
</script>
